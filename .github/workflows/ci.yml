name: CI
# Public repository: free GitHub-hosted runners only. No secrets, read-only token.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'ci/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYNOPKGLAND_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Controller lifecycle and isolation tests
        run: python3 -B -m unittest discover -s ops/private-ci -v
      - name: SDK policy and version checks
        run: |
          node --test scripts/check-internal-content.test.mjs scripts/sdk-version.test.mjs scripts/executor-manifest.test.mjs scripts/release-gate-plan.test.mjs
          node scripts/sdk-version.mjs --check
          node scripts/dsm-languages.mjs --check
          node scripts/executor-manifest.mjs --check
      - name: Fast SDK gate
        run: bash ops/private-ci/sdk-fast.sh
